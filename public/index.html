<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1>Task Board</h1>
        <p class="app__subtitle">A tiny full-stack demo for the Cloud Agent environment</p>
      </header>

      <form id="new-task-form" class="composer" autocomplete="off">
        <input
          id="new-task-input"
          class="composer__input"
          type="text"
          name="title"
          placeholder="What needs doing?"
          aria-label="New task title"
          required
        />
        <button class="composer__button" type="submit">Add</button>
      </form>

      <section class="board" aria-live="polite">
        <div class="board__meta">
          <span id="counter" class="board__counter">0 tasks</span>
          <button id="clear-completed" class="board__clear" type="button">Clear completed</button>
        </div>
        <ul id="task-list" class="task-list"></ul>
        <p id="empty-state" class="empty-state" hidden>No tasks yet — add your first one above.</p>
      </section>
    </main>

    <script src="./app.js" type="module"></script>
  </body>
</html>
